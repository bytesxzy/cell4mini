<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>robots.html — CELL4 assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tokens lifted from cell4.art's own stylesheet so this reads as part of the
   site rather than as a widget bolted onto it. */
:root{
  --bg:#f0f0f3;
  --oat:rgba(255,255,255,.58);
  --oat-solid:rgba(255,255,255,.72);
  --accent:#0a0a0a;
  --muted:#71717a;
  --line:rgba(0,0,0,.09);
  --line-soft:rgba(0,0,0,.06);
  --r-sm:10px;
  --r-md:14px;
  --shadow:0 10px 32px -14px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.8);
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.75);
  --glass:blur(24px) saturate(165%);
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Space Grotesk','Figtree',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --me:rgba(10,10,10,.92);
  --me-ink:#fafafa;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#050506;
    --oat:rgba(255,255,255,.06);
    --oat-solid:rgba(20,20,22,.82);
    --accent:#fafafa;
    --muted:#a1a1aa;
    --line:rgba(255,255,255,.10);
    --line-soft:rgba(255,255,255,.06);
    --shadow:0 12px 34px -18px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06);
    --shadow-lg:0 24px 60px -18px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07);
    --me:rgba(250,250,250,.92);
    --me-ink:#0a0a0a;
  }
}
:root[data-theme="dark"]{
  --bg:#050506;--oat:rgba(255,255,255,.06);--oat-solid:rgba(20,20,22,.82);
  --accent:#fafafa;--muted:#a1a1aa;--line:rgba(255,255,255,.10);
  --line-soft:rgba(255,255,255,.06);
  --shadow:0 12px 34px -18px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06);
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07);
  --me:rgba(250,250,250,.92);--me-ink:#0a0a0a;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:var(--sans);color:var(--accent);
     -webkit-font-smoothing:antialiased}
/* Embedded in an iframe the page IS the panel, so the ground goes transparent
   and the parent's background shows through the glass. */
body.embed{background:transparent}

#launcher{position:fixed;right:18px;bottom:18px;width:54px;height:54px;border-radius:999px;
  border:1px solid var(--line);background:var(--oat);-webkit-backdrop-filter:var(--glass);
  backdrop-filter:var(--glass);box-shadow:var(--shadow);cursor:pointer;display:flex;
  align-items:center;justify-content:center;z-index:40;
  transition:transform .35s cubic-bezier(.16,.84,.44,1),box-shadow .35s ease}
#launcher:hover{transform:translateY(-2px) scale(1.04);box-shadow:var(--shadow-lg)}
#launcher svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.6}
#launcher .live{position:absolute;top:11px;right:11px;width:7px;height:7px;border-radius:999px;
  background:#22c55e;box-shadow:0 0 0 2px var(--bg)}
body.embed #launcher{display:none}

#panel{position:fixed;right:18px;bottom:82px;width:392px;max-width:calc(100vw - 24px);
  height:min(600px,calc(100vh - 110px));display:flex;flex-direction:column;overflow:hidden;
  border-radius:var(--r-md);border:1px solid var(--line);background:var(--oat);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);box-shadow:var(--shadow-lg);
  opacity:0;transform:translateY(10px) scale(.985);pointer-events:none;z-index:41;
  transition:opacity .28s ease,transform .34s cubic-bezier(.16,.84,.44,1)}
#panel.open{opacity:1;transform:none;pointer-events:auto}
body.embed #panel{position:static;width:100%;height:100%;max-width:none;right:auto;bottom:auto;
  opacity:1;transform:none;pointer-events:auto;border-radius:0;border:0;
  box-shadow:none;background:var(--oat-solid)}

.top{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line-soft)}
.badge{width:30px;height:30px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--oat-solid);display:flex;align-items:center;justify-content:center}
.badge svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:1.7}
.who{flex:1;min-width:0}
.who b{display:block;font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:-.01em}
.who span{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.icobtn{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid transparent;
  background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.icobtn:hover{border-color:var(--line);background:var(--oat-solid);color:var(--accent)}
body.embed .close{display:none}

#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#log::-webkit-scrollbar{width:7px}
#log::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.msg{max-width:90%;font-size:13px;line-height:1.55;border-radius:var(--r-md);padding:10px 13px;
  white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .32s cubic-bezier(.16,.84,.44,1)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.bot{align-self:flex-start;background:var(--oat-solid);border:1px solid var(--line-soft);
  box-shadow:var(--shadow)}
.msg.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border:1px solid transparent}
.meta{margin-top:9px;padding-top:8px;border-top:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.src{font-family:var(--mono);font-size:10px;color:var(--muted);text-decoration:none;
  border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.src:hover{color:var(--accent);background:var(--oat-solid)}
.vote{margin-left:auto;display:flex;gap:4px}
.vote button{width:24px;height:22px;border-radius:7px;border:1px solid var(--line);
  background:none;cursor:pointer;font-size:11px;color:var(--muted);line-height:1}
.vote button:hover{color:var(--accent);background:var(--oat-solid)}
.vote button.on{background:var(--me);color:var(--me-ink);border-color:transparent}
.also{margin-top:7px;font-size:12px;color:var(--muted)}
.think{display:flex;gap:4px;align-items:center;padding:12px 13px}
.think i{width:5px;height:5px;border-radius:99px;background:var(--muted);display:block;
  animation:blip 1.1s infinite}
.think i:nth-child(2){animation-delay:.14s}.think i:nth-child(3){animation-delay:.28s}
@keyframes blip{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}

#chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
#chips button{font-size:11.5px;font-family:var(--sans);color:var(--muted);background:var(--oat-solid);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
#chips button:hover{color:var(--accent);box-shadow:var(--shadow)}

.ask{display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--line-soft)}
.ask input{flex:1;min-width:0;background:var(--oat-solid);border:1px solid var(--line);
  border-radius:999px;padding:10px 14px;font-family:var(--sans);font-size:13px;
  color:var(--accent);outline:none}
.ask input::placeholder{color:var(--muted)}
.ask input:focus{border-color:var(--accent)}
.ask button{border:0;border-radius:999px;padding:0 16px;background:var(--me);color:var(--me-ink);
  font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer}
.ask button:active{transform:scale(.97)}

#status{font-family:var(--mono);font-size:9.5px;color:var(--muted);padding:0 14px 9px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#status b{font-weight:500;color:var(--accent)}
#status .sep{opacity:.4}
#status a{color:var(--muted);text-decoration:underline;cursor:pointer}
#status a:hover{color:var(--accent)}
</style>
</head>
<body>

<button id="launcher" aria-label="Open the CELL4 assistant">
  <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="7" width="17" height="12.5" rx="3.5"></rect>
    <path d="M12 7V3.6M8.6 12.4v1.6M15.4 12.4v1.6M9.2 16.6h5.6"></path>
    <circle cx="12" cy="3" r="1.2" fill="currentColor" stroke="none"></circle>
  </svg>
  <span class="live"></span>
</button>

<section id="panel" role="dialog" aria-label="CELL4 assistant">
  <header class="top">
    <div class="badge">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="7" width="17" height="12.5" rx="3.5"></rect>
        <path d="M12 7V3.6M8.6 12.4v1.6M15.4 12.4v1.6M9.2 16.6h5.6"></path>
      </svg>
    </div>
    <div class="who"><b>robots.html</b><span id="sub">loading…</span></div>
    <button class="icobtn theme" title="Light / dark">◐</button>
    <button class="icobtn close" title="Close">✕</button>
  </header>
  <div id="log" role="log" aria-live="polite"></div>
  <div id="chips"></div>
  <div id="status"></div>
  <form class="ask" autocomplete="off">
    <input id="q" type="text" placeholder="Ask about CELL4…" aria-label="Your question">
    <button type="submit">Ask</button>
  </form>
</section>

<script>window.ROBOTS_BRAIN = /*__BRAIN__*/null/*__END__*/;</script>
<script>/*__RUNTIME__*/</script>
</body>
</html>
