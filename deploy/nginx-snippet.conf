# Drop inside your server {} block. Replace the path segment with your obscure directory name.
location /research-CHANGE-ME/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    autoindex off;
    # never serve the Lua sources or internal state
    location ~ /research-CHANGE-ME/.*\.lua$ { return 404; }
    location ~ /research-CHANGE-ME/rsi/(state|versions|data)/ { return 404; }
    # the console polls these; disable caching so the indicator is live
    location ~ /research-CHANGE-ME/rsi/www/.*\.(json|jsonl)$ { add_header Cache-Control "no-store" always; }
}
